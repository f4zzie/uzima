# Uzima defaults. Override per installation in <app data>/uzima.properties,
# or with the environment variables UZIMA_DB_URL, UZIMA_DB_USER and UZIMA_DB_PASSWORD.
# ${app.data} is replaced with the app data directory.

# Embedded H2 file database in MySQL compatibility mode. Access is protected by
# file-system permissions on the app data directory, so no password is set.
uzima.db.url=jdbc:h2:file:${app.data}/data/uzima;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
uzima.db.user=uzima
uzima.db.password=
uzima.db.pool.max-size=5
