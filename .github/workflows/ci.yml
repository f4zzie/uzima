name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp -Duzima.focusTimeline=true verify
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-ubuntu
          path: |
            target/surefire-reports/
            target/ui-snapshots/
          if-no-files-found: warn
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw.cmd -B -ntp "-Duzima.focusTimeline=true" verify
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-windows
          path: |
            target/surefire-reports/
            target/ui-snapshots/
          if-no-files-found: warn
